[project]
name = "fc27-top100-trading"
version = "0.4.0"
description = "Cloud-first FC26/FC27 PC Ultimate Team market data, shadow trading, and modeling system"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
features = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "polars>=1.8,<2",
  "pyarrow>=17,<20",
  "scikit-learn>=1.5,<2",
]
ml = [
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<4",
  "optuna>=4,<5",
  "mlflow>=2.16,<4",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
fc27-collect-once = "fc27trader.cli:collect_once"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fc27trader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
